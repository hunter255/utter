name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            pkg-config build-essential cmake
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - run: cargo fmt --check
      - name: Validate macOS development build helper
        run: bash -n scripts/build-macos-dev.sh
      # Default feature set (whisper.cpp + cloud STT) is the baseline gate.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # `sherpa` is the primary offline engine but is feature-gated (its
      # build script downloads a prebuilt native archive from a GitHub
      # release, see crates/utter-stt/Cargo.toml); these steps cover it
      # explicitly.
      - name: Clippy (sherpa)
        run: cargo clippy --workspace --all-targets --features sherpa -- -D warnings
      - name: Test (sherpa)
        run: cargo test --workspace --features sherpa
      - working-directory: apps/desktop/ui
        run: npm ci
      - working-directory: apps/desktop/ui
        run: npm test
      - working-directory: apps/desktop/ui
        run: npm run check
      - working-directory: apps/desktop/ui
        run: npm run build
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: install system dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            pkg-config build-essential cmake
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      # windows/macos check with the default feature set only (whisper.cpp +
      # cloud STT, no `sherpa`); utter-inject's evdev/uinput backends are
      # `#[cfg(target_os = "linux")]`-gated behind non-Linux stubs, so the
      # workspace compiles everywhere without platform-specific features.
      - run: cargo check --workspace
      - uses: actions/setup-node@v6
        if: matrix.os == 'macos-latest'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/ui/package-lock.json
      - name: Verify CMake (macOS)
        if: matrix.os == 'macos-latest'
        run: cmake --version
      - name: Install frontend dependencies (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: apps/desktop/ui
        run: npm ci
      - name: Rust format (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo fmt --check
      - name: Rust lint (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo test --workspace
      - name: Frontend tests (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: apps/desktop/ui
        run: npm test
      - name: Frontend check (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: apps/desktop/ui
        run: npm run check
      - name: Frontend build (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: apps/desktop/ui
        run: npm run build
      - name: Build unsigned macOS app bundle
        if: matrix.os == 'macos-latest'
        working-directory: apps/desktop/src-tauri
        run: ../ui/node_modules/.bin/tauri build --bundles app --no-sign --features sherpa,whisper-metal
