[package]
name = "utter-audio"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cpal = "0.18"
crossbeam-channel = { workspace = true }
rubato = "4"
thiserror = { workspace = true }
tracing = { workspace = true }
utter-core = { path = "../utter-core" }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["AVCaptureDevice", "AVMediaFormat", "block2"] }
