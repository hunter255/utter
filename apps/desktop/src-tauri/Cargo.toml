[package]
name = "utter-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Utter desktop app shell (Tauri)"

[lib]
name = "utter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
anyhow = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true }
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = { version = "2", optional = true }
keyring = "4"
regex = "1"
serde_json = { workspace = true }
tracing = { workspace = true }
# `fmt` + `std` only: the app maps `advanced.log_level` straight to a max
# level (see `init_tracing`), so `env-filter` is unnecessary. The writer is
# the bounded/redacting implementation in `logging.rs`.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

utter-core = { path = "../../../crates/utter-core" }
utter-audio = { path = "../../../crates/utter-audio" }
utter-inject = { path = "../../../crates/utter-inject" }
utter-refine = { path = "../../../crates/utter-refine" }
utter-store = { path = "../../../crates/utter-store" }
utter-stt = { path = "../../../crates/utter-stt" }

# Linux-only, matching the version tauri's own GTK/wry backend already
# depends on: used to set the HUD window's GTK type hint so the Wayland
# compositor excludes it from keyboard focus entirely (see sink.rs's HUD
# focus-stealing doc comment for why `tauri.conf.json`'s window config
# alone is not enough on GNOME/Mutter).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2"
core-foundation = "0.10"
core-graphics-types = "0.2"
tauri-plugin-global-shortcut = "2.3"

[features]
default = []
# Sherpa's build script downloads a prebuilt native archive on first build
# (see crates/utter-stt's own `sherpa` feature doc); NOT part of the default
# feature set so a plain `cargo build -p utter-desktop` stays offline-capable.
# Packaging builds that want the sherpa-onnx engine enable it explicitly
# with `--features sherpa`.
sherpa = ["utter-stt/sherpa"]
whisper-metal = ["utter-stt/whisper-metal"]
# Release-only updater support. Ordinary source/dev builds do not embed a
# release public key and therefore cannot accidentally install artifacts.
updater = ["dep:tauri-plugin-updater"]

[dev-dependencies]
tempfile = "3"
